<title>Home Color Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Inter:wght@400;500;600&family=PT+Sans:wght@400;700&family=Roboto+Flex:wght@400;500;600&display=swap">
<style>@@TWCSS@@</style>
<style>@@THEMECSS@@</style>
<main class="phone" id="phone">
  <div class="wall" aria-hidden="true"><img class="bgi" alt="" src="@@BGIMG@@"><img class="bgl" alt="" src="ASSET::46a75d88-02d7-4013-93fe-cac3332333f2.png"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="dim" aria-hidden="true"></div>
  <div class="scroll"><div class="scr">
    <div class="topwrap">@@TOPBLOCK@@</div>
    <div class="tp">@@TOPPART@@</div>
    <div class="content">
      <div class="tp">@@TABS@@</div>
      @@WLFINAL@@
      @@QUICK@@
      @@SIGNAL@@
      @@CAL@@
      @@NEWS@@
    </div>
  </div></div>
  @@APPBAR@@
  <aside class="sheet" id="sheet" aria-label="App theme">
    <button class="grab" id="grab" type="button" aria-label="Свернуть или развернуть шторку"></button>
    <div class="sh-body">
      <div class="themes">
        <button class="thm on" type="button" data-t="dark" aria-label="Dark"><span class="tile"><img alt="" src="ASSET::bb8a57b9-7218-418f-9637-14649399b664.png"></span><span class="tc"><img alt="" src="ASSET::3f731353-6f5f-4d98-b97f-cc20e406e379.svg"></span><span class="tl">Dark</span></button>
        <button class="thm" type="button" data-t="light" aria-label="Light"><span class="tile"><img class="crop" alt="" src="ASSET::74bd72fb-e814-4eb8-8c00-03ddceaa4aca.png"></span><span class="tc"><img alt="" src="ASSET::3f731353-6f5f-4d98-b97f-cc20e406e379.svg"></span><span class="tl">Light</span></button>
        <button class="thm" type="button" data-t="system" aria-label="System"><span class="tile"><img alt="" src="ASSET::bb8a57b9-7218-418f-9637-14649399b664.png"><span style="position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%);overflow:hidden"><img class="crop" alt="" src="ASSET::74bd72fb-e814-4eb8-8c00-03ddceaa4aca.png"></span></span><span class="tc"><img alt="" src="ASSET::3f731353-6f5f-4d98-b97f-cc20e406e379.svg"></span><span class="tl">System</span></button>
        <button class="thm" type="button" data-t="custom" aria-label="Custom"><span class="tile tcust"></span><span class="tc"><img alt="" src="ASSET::3f731353-6f5f-4d98-b97f-cc20e406e379.svg"></span><span class="tl">Custom</span></button>
      </div>
      <div class="custwrap"><div class="custin">
        <input type="range" id="hue" min="0" max="360" value="255" aria-label="Оттенок">
        <div class="briw"><span class="bl l" aria-label="Dark"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><mask id="mn"><rect width="24" height="24" fill="#fff"/><circle cx="18" cy="12" r="9.4" fill="#000"/></mask><circle cx="12" cy="12" r="10.5" mask="url(#mn)"/></svg></span><span class="bl r" aria-label="Light"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg></span><input type="range" id="bri" min="0" max="100" value="22" aria-label="Яркость"><i class="bn"></i></div>
      </div></div>
      <div class="fnt"><input type="range" id="fnt" min="0" max="4" step="1" value="4" aria-label="Шрифт"><span class="fname" id="fname">SF Pro</span></div>
    </div>
    <div class="nextwrap"><button class="next" id="next" type="button">Next</button></div>
    <div class="hind"></div>
  </aside>
</main>
<script>@@THEMEJS@@</script>
